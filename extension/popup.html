<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Material Vault 快捷采集</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <img src="icons/logo.png" alt="Material Vault" class="logo" />
        <div class="brand-text">
          <div class="title">Material Vault</div>
          <div class="subtitle">素材证据库</div>
        </div>
      </div>
      <div class="header-actions">
        <div id="status-indicator" class="status-indicator" title="服务连接中...">
          <span class="status-dot"></span>
          <span id="status-text" class="status-text">连接中</span>
        </div>
        <button id="btn-settings-toggle" class="icon-btn" title="配置服务器地址">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Settings Drawer (Hidden by default) -->
    <div id="settings-drawer" class="settings-drawer hidden">
      <div class="settings-title">服务器配置</div>
      <div class="field-group">
        <label for="server-url">Vault 服务地址</label>
        <div class="input-with-btn">
          <input type="text" id="server-url" placeholder="http://localhost:3000" />
          <button id="btn-save-settings" class="btn btn-secondary btn-sm">保存</button>
        </div>
        <span class="hint">默认地址为 http://localhost:3000</span>
      </div>
    </div>

    <!-- Main Capture Form -->
    <main id="capture-view" class="main-content">
      <!-- Title Input -->
      <div class="field-group">
        <label for="item-title">素材标题</label>
        <input type="text" id="item-title" placeholder="正在获取页面标题..." />
      </div>

      <!-- Source URL (Readonly Preview) -->
      <div class="field-group">
        <label for="item-url">来源 URL</label>
        <div class="url-preview-box">
          <svg class="icon icon-sm text-stone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
          </svg>
          <span id="item-url" class="url-text truncate">正在获取页面链接...</span>
        </div>
      </div>

      <!-- Tags Field -->
      <div class="field-group">
        <label>标签 (输入 #标签 或点击选择)</label>
        <!-- Selected / Typed Tags List -->
        <div id="tags-container" class="tags-container">
          <!-- Dynamic Tag Pills will be injected here -->
          <input type="text" id="tag-input" placeholder="+ 输入 #标签..." />
        </div>

        <!-- Quick Tags Suggestions -->
        <div id="suggested-tags-wrapper" class="suggested-tags-wrapper hidden">
          <span class="hint font-mono">常用标签：</span>
          <div id="suggested-tags" class="suggested-tags"></div>
        </div>
      </div>

      <!-- Note Textarea -->
      <div class="field-group">
        <label for="item-note">创作备注 / 灵感记录</label>
        <textarea id="item-note" rows="3" placeholder="记录为什么保存这条素材，打算在哪个视频章节使用（支持输入 #标签 自动归档）..."></textarea>
      </div>

      <!-- Footer Buttons -->
      <footer class="footer">
        <span class="keyboard-hint font-mono">Ctrl + Enter 保存</span>
        <button id="btn-save" class="btn btn-primary">
          <span id="btn-save-text">保存到 Inbox</span>
          <div id="btn-spinner" class="spinner hidden"></div>
        </button>
      </footer>
    </main>

    <!-- Success View (Hidden initially) -->
    <div id="success-view" class="success-view hidden">
      <div class="success-icon-box">
        <svg class="success-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
      </div>
      <div class="success-title">素材已成功保存！</div>
      <p class="success-desc">已存入 Material Vault 收件箱，后台正在自动归档网页正文与快照证据...</p>
      
      <div class="success-actions">
        <button id="btn-open-vault" class="btn btn-primary w-full">
          在 Material Vault 中查看
        </button>
        <button id="btn-close" class="btn btn-secondary w-full">
          完成并关闭
        </button>
      </div>
    </div>

    <!-- Error Alert Toast -->
    <div id="error-toast" class="error-toast hidden">
      <span id="error-msg"></span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
