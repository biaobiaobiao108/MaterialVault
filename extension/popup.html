<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Material Vault 快捷采集</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="app-root">
    <!-- Top Header Bar -->
    <header class="header">
      <div class="brand">
        <img src="icons/logo.png" alt="Material Vault Logo" class="brand-logo" />
        <div class="brand-info">
          <div class="brand-title">Material Vault</div>
          <div class="brand-desc">素材证据库</div>
        </div>
      </div>

      <div class="header-right">
        <!-- Live Server Status Indicator Pill -->
        <div id="status-pill" class="status-pill checking" title="正在检测服务连通性...">
          <span class="status-dot"></span>
          <span id="status-text" class="status-text font-mono">检测中</span>
        </div>

        <!-- Settings Cog Button -->
        <button id="btn-settings-toggle" class="btn-icon" title="配置服务器地址" aria-label="设置">
          <svg class="lucide-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Settings Drawer (Hidden by default) -->
    <div id="settings-drawer" class="settings-drawer hidden">
      <div class="settings-header">
        <span class="settings-title">Vault 通信配置</span>
        <button id="btn-settings-close" class="btn-close-sm" title="关闭设置">&times;</button>
      </div>
      <div class="settings-body">
        <label for="server-url" class="field-label">服务通信地址 (URL)</label>
        <div class="settings-input-row">
          <input type="text" id="server-url" placeholder="http://localhost:3000" class="input-text font-mono" />
          <button id="btn-save-settings" class="btn btn-secondary btn-sm">保存</button>
        </div>
        <div class="field-hint font-mono">默认直连本地后端：http://localhost:3000</div>
      </div>
    </div>

    <!-- Main Capture Card (QuickCapture Style) -->
    <main id="capture-view" class="main-card">
      <!-- Active URL Pill -->
      <div class="url-chip">
        <svg class="lucide-icon text-rose" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/>
          <path d="M2 12h20"/>
        </svg>
        <span id="domain-badge" class="domain-badge font-mono truncate">获取中...</span>
        <span id="url-text" class="url-text font-mono truncate">正在解析页面链接...</span>
      </div>

      <!-- Title Input -->
      <div class="input-group">
        <label for="item-title" class="field-label">素材标题</label>
        <input type="text" id="item-title" class="input-text title-input" placeholder="输入或编辑素材标题..." />
      </div>

      <!-- Note / Memo Input (Supports #tag) -->
      <div class="input-group">
        <label for="item-note" class="field-label">创作备注 / 灵感记录（输入 #标签 自动提取）</label>
        <textarea id="item-note" rows="3" class="input-textarea" placeholder="记录为什么保存这条素材，打算在哪个视频中使用...（例如：#良子 #训练对抗 #分镜备忘）"></textarea>
      </div>

      <!-- Real-time Extracted Hashtag Badges Container -->
      <div id="tags-section" class="tags-section hidden">
        <div class="tags-header">
          <svg class="lucide-icon-sm text-rose" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="4" y1="9" x2="20" y2="9"/>
            <line x1="4" y1="15" x2="20" y2="15"/>
            <line x1="10" y1="3" x2="8" y2="21"/>
            <line x1="16" y1="3" x2="14" y2="21"/>
          </svg>
          <span class="font-mono">已检测到标签:</span>
        </div>
        <div id="tags-pills-list" class="tags-pills-list"></div>
      </div>

      <!-- Bottom Controls Toolbar -->
      <div class="card-toolbar">
        <div class="toolbar-left">
          <!-- Tag Quick Select Dropdown -->
          <div class="select-container">
            <select id="quick-tag-select" class="custom-select-native" aria-label="选择已有标签">
              <option value="">+ 关联已有标签</option>
            </select>
          </div>
        </div>

        <div class="toolbar-right">
          <span class="shortcut-tip font-mono">Ctrl + Enter</span>
          <button id="btn-save" class="btn btn-primary">
            <svg id="btn-save-icon" class="lucide-icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
              <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
            </svg>
            <span id="btn-save-text">保存素材</span>
            <div id="btn-spinner" class="spinner hidden"></div>
          </button>
        </div>
      </div>
    </main>

    <!-- Success View (Smooth Transition) -->
    <div id="success-view" class="success-card hidden">
      <div class="success-icon-badge">
        <svg class="lucide-icon-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
          <polyline points="22 4 12 14.01 9 11.01"/>
        </svg>
      </div>

      <h3 class="success-title">素材已保存至 Inbox！</h3>
      <p class="success-desc">
        网页证据已进入归档队列，后台正在自动抓取 Clean Markdown 正文与网页快照...
      </p>

      <div class="success-actions">
        <button id="btn-open-vault" class="btn btn-primary w-full">
          <span>在 Material Vault 中查看</span>
          <svg class="lucide-icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
            <polyline points="15 3 21 3 21 9"/>
            <line x1="10" y1="14" x2="21" y2="3"/>
          </svg>
        </button>

        <button id="btn-close-popup" class="btn btn-secondary w-full">
          <span id="close-countdown-text">关闭弹窗 (3s)</span>
        </button>
      </div>
    </div>

    <!-- Error Toast Notification -->
    <div id="error-toast" class="toast-error hidden">
      <svg class="lucide-icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="8" x2="12" y2="12"/>
        <line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      <span id="error-msg"></span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
